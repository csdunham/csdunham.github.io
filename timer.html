<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f13;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
  }

  /* --- Setup form --- */
  #setup {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  #setup h1 {
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #888;
  }

  .inputs {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .input-group label {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #555;
  }

  .input-group input {
    width: 72px;
    background: #1a1a22;
    border: 1px solid #2e2e3e;
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 1.8rem;
    font-weight: 300;
    text-align: center;
    padding: 10px 4px;
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }
  .input-group input::-webkit-inner-spin-button,
  .input-group input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .input-group input:focus { border-color: #5b6af0; }

  .sep {
    font-size: 1.8rem;
    font-weight: 200;
    color: #444;
    padding-bottom: 18px;
  }

  /* Segmented control (reused for mode + sound) */
  .seg-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .seg-label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #444;
  }

  .seg-toggle {
    display: flex;
    background: #1a1a22;
    border: 1px solid #2e2e3e;
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }

  .seg-btn {
    background: transparent;
    color: #555;
    border: none;
    border-radius: 7px;
    padding: 8px 20px;
    font-size: 0.82rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .seg-btn.active {
    background: #2a2a3a;
    color: #c0c0d8;
  }

  /* Setup options row */
  .setup-options {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  #startBtn {
    background: #5b6af0;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 36px;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  #startBtn:hover { background: #717ef5; }
  #startBtn:active { transform: scale(0.97); }

  /* --- Timer view --- */
  #timerView {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  .ring-wrap {
    position: relative;
    width: 280px;
    height: 280px;
    cursor: default;
  }

  @media (hover: hover) {
    .ring-wrap { cursor: pointer; }
  }

  .ring-wrap svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .track {
    fill: none;
    stroke: #1e1e2a;
    stroke-width: 14;
  }

  .arc {
    fill: none;
    stroke: #5b6af0;
    stroke-width: 14;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s linear;
    transform-origin: 140px 140px;
    filter: drop-shadow(0 0 6px rgba(91,106,240,0.5));
  }

  .arc-dot {
    fill: #8e9bf7;
    transform-origin: 140px 140px;
    filter: drop-shadow(0 0 4px rgba(142,155,247,0.8));
  }

  /* Tooltip + controls share the same pinned state */
  .tooltip {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    flex-direction: column;
    gap: 4px;
  }
  .tooltip.pinned { opacity: 1; }

  .tooltip .time-display {
    font-size: 2.6rem;
    font-weight: 200;
    letter-spacing: 0.02em;
    color: #e8e8f0;
  }
  .tooltip .time-label {
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #666;
  }

  .ring-hint {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #3a3a50;
    margin-top: -16px;
  }
  @media (hover: none)  { .ring-hint { display: block; } }
  @media (hover: hover) { .ring-hint { display: none; } }

  /* Buttons: hidden until pinned, no layout shift */
  .timer-controls {
    display: flex;
    gap: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .timer-controls.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .ctrl-btn {
    background: #1a1a22;
    color: #aaa;
    border: 1px solid #2e2e3e;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .ctrl-btn:hover { background: #232330; color: #ddd; }
  #pauseBtn.active { color: #f0c060; border-color: #5a4820; }

  /* Done state */
  @keyframes flashArc {
    0%, 100% { stroke: #4ad89a; filter: drop-shadow(0 0 8px rgba(74,216,154,0.6)); opacity: 1; }
    50%       { stroke: #4ad89a; filter: drop-shadow(0 0 22px rgba(74,216,154,0.9)); opacity: 0.15; }
  }
  @keyframes flashDot {
    0%, 100% { fill: #4ad89a; filter: drop-shadow(0 0 6px rgba(74,216,154,0.8)); opacity: 1; }
    50%       { fill: #4ad89a; filter: drop-shadow(0 0 18px rgba(74,216,154,1));   opacity: 0.15; }
  }
  .arc.done     { animation: flashArc 0.55s ease-in-out 5; animation-fill-mode: forwards; }
  .arc-dot.done { animation: flashDot 0.55s ease-in-out 5; animation-fill-mode: forwards; }
</style>
</head>
<body>

<!-- Setup -->
<div id="setup">
  <h1>Set a timer</h1>

  <div class="inputs">
    <div class="input-group">
      <label>Hours</label>
      <input type="number" id="hoursInput" min="0" max="23" value="0" placeholder="0">
    </div>
    <div class="sep">:</div>
    <div class="input-group">
      <label>Minutes</label>
      <input type="number" id="minutesInput" min="0" max="59" value="5" placeholder="5">
    </div>
  </div>

  <!-- Mode + Sound options side by side -->
  <div class="setup-options">
    <div class="seg-group">
      <span class="seg-label">Direction</span>
      <div class="seg-toggle">
        <button class="seg-btn active" id="modeDownBtn">Count Down</button>
        <button class="seg-btn"        id="modeUpBtn">Count Up</button>
      </div>
    </div>
    <div class="seg-group">
      <span class="seg-label">Sound</span>
      <div class="seg-toggle">
        <button class="seg-btn active" id="soundOffBtn">Off</button>
        <button class="seg-btn"        id="soundOnBtn">On</button>
      </div>
    </div>
  </div>

  <button id="startBtn">Start</button>
</div>

<!-- Timer -->
<div id="timerView">
  <div class="ring-wrap" id="ringWrap">
    <svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
      <circle class="track"   cx="140" cy="140" r="118"/>
      <circle class="arc"     id="arcEl" cx="140" cy="140" r="118"/>
      <circle class="arc-dot" id="dotEl" cx="258" cy="140" r="7"/>
    </svg>
    <div class="tooltip" id="tooltip">
      <span class="time-display" id="timeDisplay">--:--</span>
      <span class="time-label"   id="timeLabel">remaining</span>
    </div>
  </div>

  <p class="ring-hint">tap to show · tap again to hide</p>

  <div class="timer-controls" id="timerControls">
    <button class="ctrl-btn" id="pauseBtn">Pause</button>
    <button class="ctrl-btn" id="resetBtn">Reset</button>
  </div>
</div>

<script>
  const RADIUS = 118;
  const CIRC   = 2 * Math.PI * RADIUS;

  const setup         = document.getElementById('setup');
  const timerView     = document.getElementById('timerView');
  const arcEl         = document.getElementById('arcEl');
  const dotEl         = document.getElementById('dotEl');
  const timeDisplay   = document.getElementById('timeDisplay');
  const timeLabel     = document.getElementById('timeLabel');
  const startBtn      = document.getElementById('startBtn');
  const pauseBtn      = document.getElementById('pauseBtn');
  const resetBtn      = document.getElementById('resetBtn');
  const ringWrap      = document.getElementById('ringWrap');
  const tooltip       = document.getElementById('tooltip');
  const timerControls = document.getElementById('timerControls');
  const modeDownBtn   = document.getElementById('modeDownBtn');
  const modeUpBtn     = document.getElementById('modeUpBtn');
  const soundOffBtn   = document.getElementById('soundOffBtn');
  const soundOnBtn    = document.getElementById('soundOnBtn');

  let totalSecs     = 0;
  let elapsed       = 0;
  let paused        = false;
  let done          = false;
  let countDown     = true;
  let soundEnabled  = false;
  let startAngleDeg = 0;
  let ticker        = null;
  let lastTick      = null;

  // --- mode toggle ---

  modeDownBtn.addEventListener('click', () => {
    countDown = true;
    modeDownBtn.classList.add('active');
    modeUpBtn.classList.remove('active');
  });
  modeUpBtn.addEventListener('click', () => {
    countDown = false;
    modeUpBtn.classList.add('active');
    modeDownBtn.classList.remove('active');
  });

  // --- sound toggle ---

  soundOffBtn.addEventListener('click', () => {
    soundEnabled = false;
    soundOffBtn.classList.add('active');
    soundOnBtn.classList.remove('active');
  });
  soundOnBtn.addEventListener('click', () => {
    soundEnabled = true;
    soundOnBtn.classList.add('active');
    soundOffBtn.classList.remove('active');
  });

  // --- notification sound (Web Audio API) ---
  // Three soft ascending sine tones: E5 → G5 → B5 (pleasant major triad)

  function playNotification() {
    try {
      const ctx   = new AudioContext();
      const notes = [659, 784, 988]; // Hz: E5, G5, B5
      notes.forEach((freq, i) => {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type            = 'sine';
        osc.frequency.value = freq;
        const t = ctx.currentTime + i * 0.2;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.12, t + 0.015);  // soft attack
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55); // gentle decay
        osc.start(t);
        osc.stop(t + 0.55);
      });
    } catch (e) { /* AudioContext blocked — silently skip */ }
  }

  // --- pinned state: controls both tooltip and buttons ---

  function setPinned(val) {
    tooltip.classList.toggle('pinned', val);
    timerControls.classList.toggle('visible', val);
  }

  function togglePinned() {
    if (done) return;  // stay visible once timer finishes
    setPinned(!tooltip.classList.contains('pinned'));
  }

  // --- helpers ---

  function fmtTime(secs) {
    secs = Math.max(0, Math.round(secs));
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function setArc(fraction) {
    fraction = Math.min(1, Math.max(0, fraction));
    arcEl.style.strokeDasharray  = CIRC;
    arcEl.style.strokeDashoffset = CIRC * (1 - fraction);
    arcEl.style.transform = `rotate(${startAngleDeg}deg)`;
    dotEl.style.transform = `rotate(${startAngleDeg + fraction * 360}deg)`;
  }

  function updateDisplay() {
    if (countDown) {
      timeDisplay.textContent = fmtTime(totalSecs - elapsed);
      timeLabel.textContent   = 'remaining';
    } else {
      timeDisplay.textContent = fmtTime(elapsed);
      timeLabel.textContent   = 'elapsed';
    }
  }

  function tick() {
    if (paused || done) return;
    const now = performance.now();
    elapsed += (now - lastTick) / 1000;
    lastTick = now;

    if (elapsed >= totalSecs) {
      elapsed = totalSecs;
      done    = true;
      setArc(countDown ? 0 : 1);
      updateDisplay();
      arcEl.classList.add('done');
      dotEl.classList.add('done');
      clearInterval(ticker);
      pauseBtn.disabled = true;
      setPinned(true);                        // reveal time + buttons on completion
      if (soundEnabled) playNotification();
      return;
    }

    setArc(countDown ? (totalSecs - elapsed) / totalSecs : elapsed / totalSecs);
    updateDisplay();
  }

  // --- launch ---

  function launchTimer(secs) {
    totalSecs     = secs;
    elapsed       = 0;
    paused        = false;
    done          = false;
    startAngleDeg = Math.floor(Math.random() * 360);

    setPinned(false);
    arcEl.classList.remove('done');
    dotEl.classList.remove('done');
    pauseBtn.classList.remove('active');
    pauseBtn.disabled    = false;
    pauseBtn.textContent = 'Pause';

    setArc(countDown ? 1 : 0);
    updateDisplay();

    setup.style.display     = 'none';
    timerView.style.display = 'flex';

    lastTick = performance.now();
    clearInterval(ticker);
    ticker = setInterval(tick, 100);
  }

  // --- controls ---

  startBtn.addEventListener('click', () => {
    const h    = parseInt(document.getElementById('hoursInput').value)   || 0;
    const m    = parseInt(document.getElementById('minutesInput').value) || 0;
    const secs = h * 3600 + m * 60;
    if (secs > 0) launchTimer(secs);
  });

  pauseBtn.addEventListener('click', () => {
    if (done) return;
    paused = !paused;
    if (paused) {
      pauseBtn.textContent = 'Resume';
      pauseBtn.classList.add('active');
    } else {
      pauseBtn.textContent = 'Pause';
      pauseBtn.classList.remove('active');
      lastTick = performance.now();
    }
  });

  resetBtn.addEventListener('click', () => {
    clearInterval(ticker);
    timerView.style.display = 'none';
    setup.style.display     = 'flex';
  });

  // --- keyboard ---

  document.addEventListener('keydown', e => {
    const inTimer = timerView.style.display !== 'none';
    const inSetup = setup.style.display     !== 'none';

    if (e.code === 'Space' && inTimer && !done) {
      e.preventDefault();
      pauseBtn.click();
    }
    if (e.code === 'Enter' && inSetup && e.target.tagName !== 'BUTTON') {
      startBtn.click();
    }
    if (e.code === 'Enter' && inTimer && done) {
      launchTimer(totalSecs);
    }
  });

  // --- click / tap to toggle (or restart when done) ---

  // Pointer devices: any click in the window restarts when done;
  // otherwise clicking the ring toggles the pinned state.
  document.addEventListener('click', e => {
    const inTimer = timerView.style.display !== 'none';
    if (!inTimer) return;
    if (e.target.closest('button')) return;  // let buttons work normally
    if (done) { launchTimer(totalSecs); return; }
    if (e.target.closest('#ringWrap') && e.pointerType !== 'touch') togglePinned();
  });

  let touchStartTime = 0;

  ringWrap.addEventListener('touchstart', e => {
    touchStartTime = Date.now();
    e.preventDefault();
  }, { passive: false });

  ringWrap.addEventListener('touchend', e => {
    if (Date.now() - touchStartTime < 400) {
      if (done) launchTimer(totalSecs);
      else togglePinned();
    }
    e.preventDefault();
  }, { passive: false });
</script>
</body>
</html>
